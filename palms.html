<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NakhlaGuard — Palm Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14201B; --ink-soft:#4A5750; --sand:#EDE6D6; --sand-deep:#E1D8C2;
    --palm:#1F5C4A; --palm-deep:#123A2E; --date:#B8752E; --card:#FBF9F3;
    --healthy:#2E8B57; --early:#D9822B; --moderate:#C1650E; --advanced:#A63D40;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:'IBM Plex Sans',sans-serif; background:var(--sand); color:var(--ink);
    min-height:100vh; padding:28px 20px;
  }
  h1,h2{font-family:'Space Grotesk',sans-serif}
  .wrap{max-width:640px; margin:0 auto}
  .back{display:inline-block; font-size:.85rem; color:var(--palm-deep); text-decoration:none; margin-bottom:14px}
  header{margin-bottom:18px}
  h1{font-size:1.35rem; color:var(--palm-deep); margin-bottom:4px}
  .sub{color:var(--ink-soft); font-size:.9rem}

  .add-card{
    background:var(--card); border-radius:14px; padding:20px; margin-bottom:24px;
    border-top:4px solid var(--date);
  }
  .add-card h2{font-size:1.05rem; margin-bottom:14px; color:var(--palm-deep)}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row > div{flex:1; min-width:140px}
  label{display:block; font-size:.8rem; font-weight:600; margin-bottom:5px; color:var(--ink)}
  input{
    width:100%; padding:10px; border:1.5px solid var(--sand-deep); border-radius:8px;
    font-family:inherit; background:#fff; font-size:.88rem;
  }
  input:focus{outline:2px solid var(--palm); outline-offset:1px}
  .loc-row{display:flex; gap:8px}
  .loc-row input{flex:1}
  .loc-btn{
    margin-top:0 !important; padding:10px 12px !important; width:auto !important;
    background:var(--date) !important; color:var(--ink) !important; font-size:.82rem !important;
    white-space:nowrap;
  }
  .loc-btn:hover{background:#d99a55 !important}
  .loc-status{font-size:.76rem; color:var(--ink-soft); margin-top:4px}
  button{
    margin-top:14px; padding:11px 22px; background:var(--palm); color:#fff; border:none;
    border-radius:8px; font-weight:700; cursor:pointer; font-family:'Space Grotesk',sans-serif;
    font-size:.88rem;
  }
  button:hover{background:var(--palm-deep)}

  .list-title{font-size:.85rem; font-weight:600; color:var(--ink-soft); margin-bottom:10px; text-transform:uppercase; letter-spacing:.02em}
  .palm-card{
    background:var(--card); border-radius:12px; padding:16px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    border-right:5px solid #ccc;
  }
  .palm-card.healthy{border-right-color:var(--healthy)}
  .palm-card.early{border-right-color:var(--early)}
  .palm-card.moderate{border-right-color:var(--moderate)}
  .palm-card.advanced{border-right-color:var(--advanced)}
  .palm-card .info{flex:1}
  .palm-id{font-family:'Space Grotesk',sans-serif; font-weight:700}
  .location{font-size:.85rem; color:var(--ink-soft); margin-top:2px}
  .last-check{font-size:.75rem; color:#999; margin-top:4px}
  .badge{padding:4px 12px; border-radius:20px; font-weight:700; font-size:.78rem; color:#fff; white-space:nowrap}
  .badge.healthy{background:var(--healthy)} .badge.early{background:var(--early)}
  .badge.moderate{background:var(--moderate)} .badge.advanced{background:var(--advanced)}
  .badge.unchecked{background:#aaa}

  .empty{text-align:center; color:var(--ink-soft); padding:40px 20px; font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <a href="/static/index.html" class="back">← Back to overview</a>
  <header>
    <h1>🌴 Palm Registry</h1>
    <p class="sub">Track every palm's location and health status in one place.</p>
  </header>

  <div class="add-card">
    <h2>Register a palm</h2>
    <div class="row">
      <div>
        <label>Palm ID</label>
        <input type="text" id="newPalmId" placeholder="e.g. Palm-B07">
      </div>
      <div>
        <label>Location</label>
        <div class="loc-row">
          <input type="text" id="newLocation" placeholder="Tap 📍 to auto-detect">
          <button type="button" class="loc-btn" onclick="useMyLocation('newLocation','newLocStatus')">📍</button>
        </div>
        <div class="loc-status" id="newLocStatus"></div>
      </div>
    </div>
    <label style="margin-top:10px">Additional description (optional)</label>
    <input type="text" id="newNotes" placeholder="e.g. planted 2019, irrigation line A">
    <button onclick="addPalm()">Add palm</button>
  </div>

  <div class="list-title">Registered palms</div>
  <div id="palmList"><div class="empty">Loading…</div></div>
</div>

<script>
const CLASS_MAP = { "سليم":"healthy","مبكرة":"early","متوسطة":"moderate","متقدمة":"advanced" };
const CLASS_LABEL = { healthy:"Healthy", early:"Early stage", moderate:"Moderate", advanced:"Advanced" };

// يلتقط موقع GPS الحالي من متصفح الجهاز تلقائيًا بدل الكتابة اليدوية
function useMyLocation(inputId, statusId){
  const status = document.getElementById(statusId);
  if(!navigator.geolocation){
    status.textContent = 'Geolocation is not supported on this device.';
    return;
  }
  status.textContent = 'Detecting…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude.toFixed(5);
      const lon = pos.coords.longitude.toFixed(5);
      document.getElementById(inputId).value = `${lat}, ${lon}`;
      status.textContent = '📍 Captured';
    },
    (err) => { status.textContent = 'Failed: ' + err.message; },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function loadPalms(){
  const container = document.getElementById('palmList');
  try{
    const res = await fetch('/palms');
    const data = await res.json();
    if(!data.palms.length){
      container.innerHTML = '<div class="empty">No palms registered yet — add your first one above.</div>';
      return;
    }
    container.innerHTML = data.palms.map(p => {
      const statusKey = CLASS_MAP[p.latest_status] || null;
      const badge = statusKey
        ? `<span class="badge ${statusKey}">${CLASS_LABEL[statusKey]}</span>`
        : `<span class="badge unchecked">Not tested yet</span>`;
      const lastCheck = p.latest_check ? new Date(p.latest_check).toLocaleDateString('en-US') : '';
      return `
        <div class="palm-card ${statusKey || ''}">
          <div class="info">
            <div class="palm-id">🌴 ${p.palm_id}</div>
            <div class="location">${p.location || 'No location set'}</div>
            ${lastCheck ? `<div class="last-check">Last checked: ${lastCheck}</div>` : ''}
          </div>
          ${badge}
        </div>`;
    }).join('');
  }catch(e){
    container.innerHTML = '<div class="empty">Could not load the registry. Is the server running?</div>';
  }
}

async function addPalm(){
  const palmId = document.getElementById('newPalmId').value.trim();
  const location = document.getElementById('newLocation').value.trim();
  const notes = document.getElementById('newNotes').value.trim();

  if(!palmId || !location){ alert('Please enter both a Palm ID and a location.'); return; }

  const form = new FormData();
  form.append('palm_id', palmId);
  form.append('location', location);
  if(notes) form.append('notes', notes);

  try{
    await fetch('/palms', { method:'POST', body: form });
    document.getElementById('newPalmId').value = '';
    document.getElementById('newLocation').value = '';
    document.getElementById('newNotes').value = '';
    loadPalms();
  }catch(e){
    alert('Could not save the palm. Is the server running?');
  }
}

loadPalms();
</script>
</body>
</html>
